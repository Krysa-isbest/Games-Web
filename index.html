<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banger Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="party.css">
<style>
:root{
  --bg:#f3eee6; --paper:#fbf8f3; --ink:#1f1b16; --soft:#6b6257; --faint:#a39a8e;
  --line:#e2d9cc; --accent:#b8502f; --live:#3f8a5f;
  --serif:Fraunces,Georgia,serif; --sans:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:64px 24px 80px}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:40px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,64px);line-height:1.02;margin:0;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--accent)}
.tagline{color:var(--soft);font-size:16px;margin:12px 0 0;max-width:440px;line-height:1.5}

.filters{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px}
.chip{font:500 14px var(--sans);color:var(--soft);background:none;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;transition:background .15s,color .15s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.count{font-size:12px;opacity:.6;margin-left:4px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px}
.item{display:flex;flex-direction:column}
.item.hidden{display:none}
.card{
  display:flex;flex-direction:column;text-decoration:none;color:inherit;flex:1;
  background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(60,40,20,.04);transition:transform .25s ease,box-shadow .25s ease;
}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(60,40,20,.35)}
.art{position:relative;aspect-ratio:2/1;overflow:hidden}
.art svg{width:100%;height:100%;display:block;transition:transform .6s ease}
.card:hover .art svg{transform:scale(1.04)}
.play{
  position:absolute;right:14px;bottom:14px;width:42px;height:42px;border-radius:50%;
  background:rgba(251,248,243,.92);display:grid;place-items:center;
  opacity:0;transform:translateY(6px);transition:all .25s ease;
}
.card:hover .play{opacity:1;transform:none}
.flags{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.flag.big{color:#fff;background:rgba(184,80,47,.94)}
.flag{
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(251,248,243,.92);color:var(--live);border-radius:999px;padding:5px 10px;display:flex;align-items:center;gap:6px;
}
.flag i{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.body h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--faint)}
.body p{margin:0;color:var(--soft);font-size:14.5px;line-height:1.55}
.meta{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--soft)}
.mode{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.mode svg{width:16px;height:16px}
.mode.mp{color:var(--accent)}
.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--faint)}

.logbtn{
  align-self:flex-start;margin:10px 0 0 4px;font:500 13px var(--sans);color:var(--soft);
  background:none;border:0;padding:4px 2px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  border-bottom:1px solid transparent;transition:color .15s,border-color .15s;
}
.logbtn:hover{color:var(--ink);border-color:var(--ink)}
.logbtn .dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.logbtn.live .dot{background:var(--live)}

footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--line);color:var(--faint);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* changelog dialog */
dialog{
  border:0;border-radius:18px;padding:0;max-width:520px;width:calc(100% - 32px);
  background:var(--paper);color:var(--ink);box-shadow:0 30px 80px -20px rgba(40,25,10,.45);
}
dialog[open]{animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
dialog::backdrop{background:rgba(31,27,22,.3);backdrop-filter:blur(3px)}
.dhead{display:flex;align-items:flex-start;gap:12px;padding:24px 26px 16px}
.dhead div{flex:1}
.dhead h3{margin:0;font:600 26px var(--serif)}
.x{font:400 22px var(--sans);color:var(--soft);background:none;border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;line-height:1}
.x:hover{color:var(--ink);border-color:var(--soft)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-top:8px}
.status i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.status.live{color:var(--live)}.status.live i{background:var(--live)}
.dbody{padding:4px 26px 26px;max-height:60vh;overflow:auto}
.note{font-size:14px;color:var(--soft);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 16px;line-height:1.5}
.entry{padding:14px 0;border-top:1px solid var(--line)}
.entry b{font:600 17px var(--serif)}
.entry small{color:var(--faint);margin-left:8px;font-size:13px}
.entry ul{margin:8px 0 0;padding-left:18px;color:var(--soft);font-size:14.5px;line-height:1.6}
.empty{color:var(--faint);margin:0;padding:14px 0;border-top:1px solid var(--line);font-size:14.5px}

@media (max-width:560px){
  .wrap{padding:40px 16px 60px}
  .grid{grid-template-columns:1fr}
  .filters{width:100%}.chip{flex:1;padding:8px 6px}
  .play{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Browser games</p>
      <h1>Banger <em>Games</em></h1>
      <p class="tagline">A small collection of games that run right in your browser. Pick one and play — some are better with friends.</p>
    </div>
    <div class="filters" role="group" aria-label="Filter games">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="mp" aria-pressed="false">Multiplayer</button>
      <button class="chip" data-f="solo" aria-pressed="false">Single player</button>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <footer><span>Banger Games</span><span id="total"></span></footer>
</div>

<dialog id="log">
  <div class="dhead">
    <div><h3 id="logTitle">Changelog</h3><div id="logStatus"></div></div>
    <button class="x" id="logClose" aria-label="Close">×</button>
  </div>
  <div class="dbody" id="logBody"></div>
</dialog>

const ICON_MP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 13.6c2.6.2 4.5 2 4.5 4.9"/></svg>';
const ICON_SOLO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/></svg>';
const ICON_PLAY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#1f1b16"><path d="M8 5.5v13l11-6.5z"/></svg>';

const grid = document.getElementById('grid');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

GAMES.forEach((g, i) => {
  const item = document.createElement('div');
  item.className = 'item';
  item.dataset.mp = g.mp ? 'mp' : 'solo';
  item.dataset.idx = i;
  item.innerHTML = `
    <a class="card" href="${encodeURI(g.file)}">
      <div class="art">
        <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${ART[g.art] || ''}</svg>
        ${g.big || g.updating ? `<div class="flags">${g.big ? '<span class="flag big">★ Big project</span>' : ''}${g.updating ? '<span class="flag"><i></i>In development</span>' : ''}</div>` : ''}
        <span class="play">${ICON_PLAY}</span>
      </div>
      <div class="body">
        <div class="title"><h2>${esc(g.title)}</h2>${g.subtitle ? `<span class="sub">${esc(g.subtitle)}</span>` : ''}</div>
        <p>${esc(g.desc)}</p>
        <div class="meta">
          <span class="mode ${g.mp ? 'mp' : ''}">${g.mp ? ICON_MP + esc(g.mp) : ICON_SOLO + 'Single player'}</span>
          <span class="sep"></span><span>${esc(g.genre)}</span>
          <span class="sep"></span><span>${esc(g.lang)}</span>
        </div>
      </div>
    </a>
    <button class="logbtn${g.updating ? ' live' : ''}" data-i="${i}"><span class="dot"></span>Changelog</button>`;
  grid.appendChild(item);
});

// filter counts
const nMp = GAMES.filter(g => g.mp).length;
const counts = { all: GAMES.length, mp: nMp, solo: GAMES.length - nMp };
document.querySelectorAll('.chip').forEach(c => c.insertAdjacentHTML('beforeend', `<span class="count">${counts[c.dataset.f]}</span>`));
document.getElementById('total').textContent = GAMES.length + ' games';

document.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === chip));
  const f = chip.dataset.f;
  document.querySelectorAll('.item').forEach(it => it.classList.toggle('hidden', f !== 'all' && it.dataset.mp !== f));
}));

// changelog
const dlg = document.getElementById('log');
grid.addEventListener('click', e => {
  const b = e.target.closest('.logbtn');
  if (!b) return;
  const g = GAMES[b.dataset.i];
  const log = g.changelog || [];
  document.getElementById('logTitle').textContent = g.title;
  document.getElementById('logStatus').innerHTML = g.updating
    ? '<span class="status live"><i></i>Receiving updates</span>'
    : '<span class="status"><i></i>Not currently updated</span>';
  let h = g.mpNote ? `<p class="note">${esc(g.mpNote)}</p>` : '';
  h += log.length
    ? log.map(c => `<div class="entry"><b>${esc(c.title || 'v' + c.version)}</b>${c.date ? `<small>${esc(c.date)}</small>` : ''}<ul>${c.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>`).join('')
    : '<p class="empty">No changelog entries yet.</p>';
  document.getElementById('logBody').innerHTML = h;
  dlg.showModal();
});
document.getElementById('logClose').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
</script>
