<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Ping Pong: Nuclear Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #05060d;
        --p1: #00ffcc;
        --p2: #ff2d95;
        --gold: #ffd23f;
        --panel: #0c0e1d;
        --card: #090b17;
        --line: #232848;
        --text: #e2e8ff;
        --muted: #8b93b8;
        --red: #ff3344;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
        background: radial-gradient(ellipse at top, #15173a 0%, #05060d 65%) fixed;
        color: var(--text);
        font-family: 'Chakra Petch', system-ui, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; padding: 12px; user-select: none; overflow-x: hidden;
    }
    .pixel { font-family: 'Press Start 2P', monospace; }
    header { text-align: center; margin-bottom: 10px; }
    h1 {
        font-family: 'Press Start 2P', monospace; font-size: clamp(12px, 2.4vw, 22px);
        color: var(--p1); text-shadow: 0 0 10px var(--p1), 0 0 26px var(--p1);
        letter-spacing: 3px; margin: 0 0 6px;
    }
    h1 span { color: #ffb000; text-shadow: 0 0 10px #ff6a00, 0 0 26px #ff2a00; }
    .hint { font-size: 13px; color: var(--muted); margin: 0; }
    kbd {
        font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 3px 5px; border-radius: 4px;
        border: 1px solid var(--line); background: #11142a; color: var(--text);
    }

    #wrap {
        position: relative;
        width: min(100%, 1100px, calc((100vh - 140px) * 1.7778));
        aspect-ratio: 16 / 9;
        border: 3px solid var(--p1); border-radius: 14px; overflow: hidden; background: #000;
        box-shadow: 0 0 30px rgba(0,255,204,.35), inset 0 0 30px rgba(0,255,204,.12);
    }
    @media (max-width: 640px) { #wrap { aspect-ratio: 4 / 3; width: 100%; } }
    #game { width: 100%; height: 100%; display: block; }
    #wrap.crt::after {
        content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background:
            repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
            radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%);
    }

    .overlay {
        position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 16px;
        background: rgba(4,5,12,.78); backdrop-filter: blur(3px); overflow-y: auto;
    }
    .hidden { display: none !important; }
    .title {
        font-family: 'Press Start 2P', monospace; font-size: clamp(14px, 3vw, 28px); margin: 0;
        color: #ffb000; text-shadow: 0 0 12px #ff6a00, 0 0 30px #ff2a00;
        animation: flicker 4s infinite;
    }
    @keyframes flicker { 0%, 92%, 100% { opacity: 1; } 93% { opacity: .5; } 95% { opacity: 1; } 97% { opacity: .7; } }

    .btn {
        --c: var(--p1);
        font-family: 'Press Start 2P', monospace; font-size: 11px; padding: 12px 18px; border-radius: 10px;
        border: 2px solid var(--c); background: rgba(0,0,0,.35); color: var(--c); cursor: pointer;
        text-shadow: 0 0 8px var(--c); box-shadow: 0 0 14px -4px var(--c), inset 0 0 12px -6px var(--c);
        transition: transform .12s, background .12s, box-shadow .12s;
    }
    .btn:hover { transform: translateY(-2px) scale(1.04); background: var(--c); color: #05060d; text-shadow: none; box-shadow: 0 0 26px var(--c); }
    .btn.big { font-size: clamp(13px, 2vw, 18px); padding: 16px 34px; }
    .btn.gold { --c: var(--gold); }
    .btn.pink { --c: var(--p2); }
    .btn.red { --c: var(--red); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    .wallets { display: flex; gap: 12px; }
    .wallet {
        font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 8px 12px; border-radius: 8px;
        border: 1px solid currentColor; background: rgba(0,0,0,.4);
    }
    .wallet.p1 { color: var(--p1); } .wallet.p2 { color: var(--p2); }
    .wallet b { color: var(--gold); text-shadow: 0 0 8px var(--gold); }

    .seg-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .seg {
        font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; padding: 7px 12px; border-radius: 8px;
        border: 1px solid var(--line); background: #0b0d1c; color: var(--muted); cursor: pointer; transition: all .12s;
    }
    .seg:hover { color: var(--text); border-color: #3b4277; }
    .seg.on { color: #05060d; background: var(--p1); border-color: var(--p1); box-shadow: 0 0 12px -2px var(--p1); }
    .seg.locked { opacity: .55; }
    .seg.off { text-decoration: line-through; opacity: .5; }

    #overCoins { font-family: 'Press Start 2P', monospace; font-size: 12px; line-height: 2; color: var(--gold); text-shadow: 0 0 8px var(--gold); }
    #overText { font-size: 16px; color: var(--muted); margin: 0; }

    /* Modals */
    .modal {
        position: fixed; inset: 0; z-index: 50; background: rgba(2,3,8,.9); backdrop-filter: blur(4px);
        display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 24px 12px;
    }
    .modal-box {
        width: min(1000px, 100%); background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
        padding: 18px; box-shadow: 0 0 60px rgba(0,0,0,.6);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .modal-head h2 { font-family: 'Press Start 2P', monospace; font-size: 16px; margin: 0; color: var(--gold); text-shadow: 0 0 10px var(--gold); }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab { font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 10px 14px; }
    .tab.on.t1 { background: var(--p1); border-color: var(--p1); }
    .tab.on.t2 { background: var(--p2); border-color: var(--p2); }
    .tab.on.t3 { background: var(--gold); border-color: var(--gold); }
    h3 { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--muted); margin: 18px 0 10px; letter-spacing: 1px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
    .card {
        --c: var(--p1);
        border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--card);
        display: flex; flex-direction: column; gap: 8px; transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: var(--c); transform: translateY(-2px); }
    .card.maxed { border-color: color-mix(in srgb, var(--c) 50%, transparent); }
    .card-top { display: flex; gap: 10px; align-items: center; }
    .ic { font-size: 28px; line-height: 1; filter: drop-shadow(0 0 6px var(--c)); }
    .nm { font-weight: 700; font-size: 15px; }
    .card p { margin: 0; font-size: 13px; color: var(--muted); flex: 1; line-height: 1.35; }
    .pips { display: flex; gap: 4px; margin-top: 4px; }
    .pips i { width: 14px; height: 6px; border-radius: 3px; background: #1c2040; }
    .pips i.on { background: var(--c); box-shadow: 0 0 6px var(--c); }
    .tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 1px; }
    .tag.buff { background: #12361a; color: #4ade80; }
    .tag.debuff { background: #3a1018; color: #fb7185; }
    .tag.chaos { background: #2a1640; color: #c084fc; }
    .tag.perm { background: #3a2f0a; color: var(--gold); }
    .buy {
        font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 9px; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--gold); background: rgba(255,210,63,.1); color: var(--gold); transition: all .12s;
    }
    .buy:hover:not(:disabled) { background: var(--gold); color: #05060d; }
    .buy.dim { opacity: .45; }
    .buy:disabled { cursor: default; border-color: var(--line); color: var(--muted); background: transparent; }
    .buy.p1 { border-color: var(--p1); color: var(--p1); background: rgba(0,255,204,.08); }
    .buy.p1:hover:not(:disabled) { background: var(--p1); color: #05060d; }
    .buy.p2 { border-color: var(--p2); color: var(--p2); background: rgba(255,45,149,.08); }
    .buy.p2:hover:not(:disabled) { background: var(--p2); color: #05060d; }
    .buy-row { display: flex; gap: 6px; } .buy-row .buy { flex: 1; }
    .shake { animation: shakeX .35s; }
    @keyframes shakeX { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    .note { font-size: 13px; color: var(--muted); }

    .set-row { display: grid; grid-template-columns: 210px 1fr; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .set-label { font-weight: 700; font-size: 14px; }
    @media (max-width: 600px) { .set-row { grid-template-columns: 1fr; } }

    #toast {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); z-index: 80; opacity: 0;
        font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 12px 16px; border-radius: 10px;
        background: #11142a; border: 1px solid var(--gold); color: var(--gold); transition: all .25s; pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Touch controls */
    #touch { display: none; width: 100%; max-width: 1100px; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
    @media (pointer: coarse), (max-width: 700px) { #touch { display: grid; } }
    .tgroup { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .tbtn {
        font-family: 'Press Start 2P', monospace; font-size: 14px; padding: 16px 0; border-radius: 10px;
        background: rgba(0,0,0,.4); border: 2px solid var(--c); color: var(--c); touch-action: none;
    }
    .tbtn:active, .tbtn.held { background: var(--c); color: #05060d; }
</style>
</head>
<body>

<header>
    <h1>NEON PING PONG: <span>NUCLEAR EDITION</span></h1>
    <p class="hint">P1: <kbd>W</kbd><kbd>S</kbd> + <kbd>D</kbd> raketa &nbsp;·&nbsp; P2: <kbd>↑</kbd><kbd>↓</kbd> + <kbd>←</kbd> raketa &nbsp;·&nbsp; <kbd>P</kbd> pauza</p>
</header>

<div id="wrap" class="crt">
    <canvas id="game"></canvas>

    <div id="menu" class="overlay">
        <h2 class="title">☢ NUKLEÁRNÍ ARÉNA ☢</h2>
        <div class="wallets">
            <div class="wallet p1">P1 <b id="coins1">0</b> 🪙</div>
            <div class="wallet p2">P2 <b id="coins2">0</b> 🪙</div>
        </div>
        <div class="seg-group" id="modeGroup">
            <button class="seg" data-mode="pvp">👥 2 HRÁČI</button>
            <button class="seg" data-mode="ai">🤖 VS POČÍTAČ</button>
        </div>
        <button id="playBtn" class="btn big">▶ START</button>
        <div class="row">
            <button id="shopBtn" class="btn gold">🛒 OBCHOD</button>
            <button id="setBtn" class="btn pink">⚙ NASTAVENÍ</button>
        </div>
        <p class="hint">Vítěz dostane 10 🪙, poražený 4 🪙. Utrať je za vylepšení a nové power-upy.</p>
    </div>

    <div id="pause" class="overlay hidden">
        <h2 class="title">PAUZA</h2>
        <div class="row">
            <button id="resumeBtn" class="btn big">▶ POKRAČOVAT</button>
        </div>
        <button id="quitBtn" class="btn red">✖ VZDÁT A DO MENU</button>
    </div>

    <div id="over" class="overlay hidden">
        <h2 class="title" id="overTitle">KONEC</h2>
        <p id="overText"></p>
        <div id="overCoins"></div>
        <div class="row">
            <button id="againBtn" class="btn big">↻ ZNOVU</button>
        </div>
        <div class="row">
            <button id="overShopBtn" class="btn gold">🛒 OBCHOD</button>
            <button id="menuBtn" class="btn pink">☰ MENU</button>
        </div>
    </div>
</div>

<div id="touch">
    <div class="tgroup" data-p="0" style="--c: var(--p1)">
        <button class="tbtn" data-act="up">▲</button>
        <button class="tbtn" data-act="fire">🚀</button>
        <button class="tbtn" data-act="down">▼</button>
    </div>
    <div class="tgroup" data-p="1" id="touchP2" style="--c: var(--p2)">
        <button class="tbtn" data-act="up">▲</button>
        <button class="tbtn" data-act="fire">🚀</button>
        <button class="tbtn" data-act="down">▼</button>
    </div>
</div>

<div id="shop" class="modal hidden">
    <div class="modal-box">
        <div class="modal-head">
            <h2>🛒 OBCHOD</h2>
            <div class="wallets" id="shopCoins"></div>
            <button class="btn" data-close="shop">✖ ZAVŘÍT</button>
        </div>
        <div class="tabs">
            <button class="seg tab t1" data-tab="0">HRÁČ 1</button>
            <button class="seg tab t2" data-tab="1">HRÁČ 2</button>
            <button class="seg tab t3" data-tab="2">ARÉNA &amp; POWER-UPY</button>
        </div>
        <div id="shopBody"></div>
    </div>
</div>

<div id="settings" class="modal hidden">
    <div class="modal-box">
        <div class="modal-head">
            <h2>⚙ NASTAVENÍ</h2>
            <button class="btn" data-close="settings">✖ ZAVŘÍT</button>
        </div>
        <div id="setBody"></div>
    </div>
</div>

<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const canvas = $('#game');
const ctx = canvas.getContext('2d');
const wrap = $('#wrap');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

// ================= DATA =================
const POWERUPS = {
    LONG:      { icon: '📏', name: 'Dlouhá pálka',      color: '#39ff14', w: 28, kind: 'buff',   base: true, desc: 'Tvoje pálka je na 10 s o 55 % delší.' },
    SHORT:     { icon: '🔻', name: 'Scvrknutí soupeře', color: '#ff7a00', w: 24, kind: 'debuff', base: true, desc: 'Soupeřova pálka se na 10 s zmenší.' },
    TURBO:     { icon: '⚡', name: 'Turbo míček',       color: '#ffee00', w: 18, kind: 'chaos',  base: true, desc: 'Všechny míčky zrychlí o 40 % a začnou hořet.' },
    POINT:     { icon: '⭐', name: 'Bonusový bod',      color: '#00e5ff', w: 6,  kind: 'buff',   base: true, desc: '+1 bod okamžitě.' },
    ROCKETS:   { icon: '🚀', name: 'Raketová munice',   color: '#ff3d81', w: 18, kind: 'buff',   base: true, desc: '+3 rakety, funguje i bez raketometu.' },
    NUKE:      { icon: '☢️', name: 'ATOMOVKA',          color: '#ff1a1a', w: 4,  kind: 'debuff', base: true, desc: 'Atomová střela na soupeře. Kdo neuhne, je omráčen, zmenšen a přijde o bod.' },
    MULTI:     { icon: '🔮', name: 'Multiball',         color: '#c084fc', w: 14, kind: 'chaos',  cost: 15, desc: 'Míček se rozdělí na tři.' },
    FREEZE:    { icon: '❄️', name: 'Zmrazení',          color: '#7dd3fc', w: 12, kind: 'debuff', cost: 15, desc: 'Soupeř na ~2 s zamrzne na místě.' },
    SLOW:      { icon: '🐌', name: 'Sliz',              color: '#a3e635', w: 14, kind: 'debuff', cost: 10, desc: 'Soupeřova pálka je 8 s pomalá jako šnek.' },
    INVERT:    { icon: '🔄', name: 'Zmatení',           color: '#e879f9', w: 12, kind: 'debuff', cost: 20, desc: 'Soupeř má 7 s obrácené ovládání.' },
    GHOST:     { icon: '👻', name: 'Duch',              color: '#cbd5e1', w: 10, kind: 'debuff', cost: 15, desc: 'Míček letící k soupeři je 8 s skoro neviditelný.' },
    SHIELD:    { icon: '🛡️', name: 'Štít',              color: '#60a5fa', w: 10, kind: 'buff',   cost: 15, desc: 'Energetická bariéra za pálkou zastaví 1 gól.' },
    BIGMAP:    { icon: '🗺️', name: 'Mega aréna',        color: '#22d3ee', w: 10, kind: 'chaos',  cost: 20, desc: 'Hřiště se na 15 s zvětší o 40 %.' },
    BLACKHOLE: { icon: '🕳️', name: 'Černá díra',        color: '#a855f7', w: 8,  kind: 'chaos',  cost: 25, desc: 'Gravitační vír na 9 s ohýbá dráhu míčků.' },
    MYSTERY:   { icon: '❓', name: 'Záhadná krabice',   color: '#fbbf24', w: 10, kind: 'chaos',  cost: 10, desc: 'Náhodný efekt. 35 % šance, že se obrátí proti tobě!' },
};
const ARENA_EXTRAS = [
    { id: 'DOUBLE', icon: '🎁', name: 'Dvojité boxy',       desc: 'Na hřišti můžou být 2 power-upy najednou.', cost: 25 },
    { id: 'XL',     icon: '🏟️', name: 'Trvalá Mega aréna',  desc: 'Odemkne v nastavení natrvalo větší hřiště.', cost: 40 },
];
const UPGRADES = [
    { id: 'length',   icon: '📏', name: 'Delší pálka',    desc: '+10 px délky pálky. Navždy.', max: 3, cost: [10, 20, 35] },
    { id: 'speed',    icon: '💨', name: 'Turbo motor',    desc: '+12 % rychlost pohybu pálky.', max: 3, cost: [10, 20, 35] },
    { id: 'spin',     icon: '🌀', name: 'Falše',          desc: 'Pohyb pálky při úderu zakroutí dráhu míčku.', max: 1, cost: [20] },
    { id: 'shield',   icon: '🛡️', name: 'Záložní štít',   desc: 'Každý zápas začneš se štítem, který chytí 1 gól.', max: 1, cost: [30] },
    { id: 'launcher', icon: '🚀', name: 'Raketomet',      desc: 'Střílej rakety (P1: D / mezerník, P2: ← / Enter). Trefa míčku ho odpálí na soupeře, trefa pálky soupeře ho omráčí. Zásobník se sám dobíjí.', max: 1, cost: [25] },
    { id: 'ammo',     icon: '📦', name: 'Větší zásobník', desc: '+1 raketa a rychlejší dobíjení.', max: 3, cost: [15, 25, 40], req: 'launcher' },
    { id: 'homing',   icon: '🎯', name: 'Navádění',       desc: 'Rakety se samy navádí na míček.', max: 1, cost: [30], req: 'launcher' },
    { id: 'blast',    icon: '💥', name: 'Těžká hlavice',  desc: 'Větší výbuch a delší omráčení soupeře.', max: 2, cost: [20, 35], req: 'launcher' },
    { id: 'greed',    icon: '🪙', name: 'Chamtivost',     desc: '+3 mince za každý odehraný zápas.', max: 3, cost: [15, 30, 50] },
];
const CONSUMABLES = [
    { id: 'c_rockets',   icon: '🧨', name: 'Startovní rakety', desc: '+3 rakety na začátku zápasu.', cost: 4 },
    { id: 'c_shield',    icon: '🔰', name: 'Startovní štít',   desc: 'Začneš zápas se štítem za pálkou.', cost: 6 },
    { id: 'c_giant',     icon: '🦒', name: 'Obří start',       desc: 'Prvních 20 s máš dlouhou pálku.', cost: 5 },
    { id: 'c_headstart', icon: '🏁', name: 'Náskok',           desc: 'Začínáš zápas s 1 bodem.', cost: 12 },
    { id: 'c_double',    icon: '💰', name: 'Dvojité mince',    desc: 'Odměna za příští zápas ×2.', cost: 8 },
];
const BALL_SPEEDS = { slow: { base: 4.5, max: 11 }, normal: { base: 5.5, max: 14 }, fast: { base: 6.8, max: 17 }, insane: { base: 8.5, max: 21 } };
const PU_RATE = { off: Infinity, low: 620, normal: 380, high: 220, chaos: 90 };
const AI_CFG = {
    easy:   { react: 18, err: 55, speed: 0.75, fire: 0.004, coins: 0.6, upg: {} },
    normal: { react: 10, err: 28, speed: 0.92, fire: 0.010, coins: 1,   upg: { launcher: 1 } },
    hard:   { react: 5,  err: 12, speed: 1.05, fire: 0.020, coins: 1.5, upg: { launcher: 1, ammo: 1, homing: 1, speed: 1, length: 1 } },
    insane: { react: 2,  err: 4,  speed: 1.2,  fire: 0.035, coins: 2,   upg: { launcher: 1, ammo: 3, homing: 1, blast: 2, speed: 3, length: 2, spin: 1 } },
};
const FX_INFO = {
    long: { icon: '📏', color: '#39ff14' }, short: { icon: '🔻', color: '#ff7a00' }, nuke: { icon: '☢️', color: '#ffdd00' },
    slow: { icon: '🐌', color: '#a3e635' }, freeze: { icon: '❄️', color: '#7dd3fc' }, stun: { icon: '⚡', color: '#ffee00' },
    invert: { icon: '🔄', color: '#e879f9' },
};

function defaultSave() {

        coins: [10, 10], upg: [{}, {}], cons: [{}, {}], unlocked: {}, disabled: {},
        settings: { mode: 'pvp', ai: 'normal', winScore: 7, ballSpeed: 'normal', puRate: 'normal', arena: 'normal', classicNuke: false, shake: 1, particles: 'high', crt: true, sound: true, volume: 0.5 },
        stats: { games: 0 },

}
function loadSave() {

        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
            const s = JSON.parse(raw);
            return { ...d, ...s, settings: { ...d.settings, ...(s.settings || {}) }, stats: { ...d.stats, ...(s.stats || {}) } };
        }

}

// ================= AUDIO =================
const Sfx = (() => {
    let ac = null, master = null, noiseBuf = null;
    function init() {
        if (ac) return;
        try {
            ac = new (window.AudioContext || window.webkitAudioContext)();
            master = ac.createGain();
            master.gain.value = 0.8;
            master.connect(ac.destination);
            noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
            const d = noiseBuf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        } catch (e) { ac = null; }
    }
    const vol = () => (S().sound ? S().volume : 0);
    function tone(freq, dur, type = 'square', gain = 0.15, slideTo = null, delay = 0) {
        if (!ac || !vol()) return;
        const t = ac.currentTime + delay;
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
        g.gain.setValueAtTime(gain * vol(), t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(master);
        o.start(t); o.stop(t + dur + 0.02);
    }
    function noise(dur, gain = 0.3, freq = 1200, freqTo = null, delay = 0) {
        if (!ac || !vol()) return;
        const t = ac.currentTime + delay;
        const s = ac.createBufferSource();
        s.buffer = noiseBuf; s.loop = true;
        const f = ac.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.setValueAtTime(freq, t);
        if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
        const g = ac.createGain();
        g.gain.setValueAtTime(gain * vol(), t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f).connect(g).connect(master);
        s.start(t); s.stop(t + dur + 0.05);
    }
    return {
        init,
        resume() { if (ac && ac.state === 'suspended') ac.resume(); },
        hit(sp) { tone(260 + sp * 30, 0.08, 'square', 0.12); tone(130 + sp * 15, 0.1, 'triangle', 0.1); },
        wall() { tone(170, 0.06, 'square', 0.07); },
        score() { tone(523, 0.12, 'square', 0.12); tone(784, 0.16, 'square', 0.12, null, 0.1); tone(1046, 0.3, 'square', 0.1, null, 0.2); },
        power() { tone(440, 0.1, 'triangle', 0.16, 880); tone(660, 0.18, 'triangle', 0.13, 1320, 0.08); },
        bad() { tone(380, 0.25, 'sawtooth', 0.1, 110); },
        coin() { tone(988, 0.07, 'square', 0.09); tone(1319, 0.2, 'square', 0.09, null, 0.06); },
        click() { tone(700, 0.04, 'square', 0.05); },
        launch() { noise(0.35, 0.2, 3500, 400); tone(240, 0.3, 'sawtooth', 0.06, 80); },
        boom(size = 1) { noise(0.35 + size * 0.4, 0.5 * Math.min(size, 1.4), 2600, 70); tone(110, 0.35 * size + 0.1, 'sine', 0.4, 28); },
        zap() { for (let i = 0; i < 5; i++) tone(rand(800, 1900), 0.05, 'sawtooth', 0.06, 200, i * 0.035); },
        siren() { for (let i = 0; i < 3; i++) { tone(550, 0.22, 'sawtooth', 0.08, 1100, i * 0.42); tone(1100, 0.2, 'sawtooth', 0.08, 550, i * 0.42 + 0.21); } },
        nuke() { noise(1.0, 1, 9000, 600); noise(4, 0.9, 2500, 30, 0.05); tone(55, 3.5, 'sine', 0.7, 16); tone(85, 2.4, 'triangle', 0.35, 22); },
        shield() { tone(1300, 0.25, 'sine', 0.14, 300); noise(0.15, 0.1, 5000, 1000); },
        freeze() { tone(2200, 0.45, 'sine', 0.09, 500); noise(0.35, 0.12, 7000, 2000); },
        whoosh() { noise(0.6, 0.15, 400, 3000); },
        win() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.25, 'square', 0.1, null, i * 0.11)); },
    };
})();

}

// ================= AI =================
function predictY(p) {
    const dirSign = p.i === 0 ? -1 : 1;
    let best = null, bt = Infinity;
    for (const b of game.balls) {
        if (b.wait > 0 || Math.sign(b.vx) !== dirSign) continue;
        const t = ((p.i === 0 ? p.x + p.w : p.x) - b.x) / b.vx;
        if (t > 0 && t < bt) { bt = t; best = b; }
    }
    if (!best) return H / 2;
    const lo = best.r, span = H - 2 * best.r;
    let y = best.y + best.vy * bt - lo;
    y = ((y % (2 * span)) + 2 * span) % (2 * span);
    if (y > span) y = 2 * span - y;
    return y + lo;
}
function aiDir(p) {
    const cfg = aiCfg(), a = p.ai, cy = p.y + p.h / 2;
    if (--a.t <= 0) { a.t = cfg.react; a.target = predictY(p) + rand(-1, 1) * cfg.err; }
    const d = a.target - cy;
    return Math.abs(d) < Math.max(6, p.h * 0.12) ? 0 : Math.sign(d);
}
function aiFire(p) {
    if (p.ammo <= 0 || p.fireCd > 0) return false;
    const cfg = aiCfg(), cy = p.y + p.h / 2, opp = game.players[1 - p.i];
    const dirSign = p.i === 0 ? -1 : 1;
    for (const b of game.balls) {
        const ahead = (b.x - p.x) * -dirSign > 0;
        if (Math.sign(b.vx) === dirSign && ahead && Math.abs(b.x - p.x) < W * 0.55 && Math.abs(b.y - cy) < 45 && Math.random() < cfg.fire * 6) return true;
    }
    return Math.abs(opp.y + opp.h / 2 - cy) < 30 && Math.random() < cfg.fire;
}

function makeBall(x, y, vx, vy) { return { x, y, vx, vy, r: 8, trail: [], last: -1, spin: 0, turbo: 0, wait: 0, toward: 0 }; }
function serveBall(toward) {
    const b = makeBall(W / 2, H / 2, 0, 0);
    b.wait = 70; b.toward = toward;
    game.balls.push(b);
}
function startMatch(demo = false) {
    game.demo = demo;
    game.mode = demo ? 'demo' : S().mode;
    game.state = 'PLAYING';
    game.scores = [0, 0];
    Object.assign(game, { balls: [], rockets: [], nukes: [], boxes: [], particles: [], rings: [], texts: [], decals: [], emitters: [],
        blackHole: null, ghost: null, bigMap: 0, spawnT: 0, winner: -1, rally: 0, banner: null, hitstop: 0, slowmo: 0, tint: 0, flash: 0 });
    [W, H] = baseDims();
    game.matchCons = [{}, {}];
    if (!demo) {
        for (let i = 0; i < 2; i++) {
            if (game.mode === 'ai' && i === 1) continue;
            game.matchCons[i] = { ...save.cons[i] };
            save.cons[i] = {};
        }
        persist();
    }
    game.players = [makePlayer(0), makePlayer(1)];
    game.players.forEach((p, i) => {
        const c = game.matchCons[i];
        if (c.c_rockets) p.ammo += 3;
        if (c.c_shield) p.shield++;
        if (c.c_giant) setFx(p, 'long', 1200);
        if (c.c_headstart) game.scores[i] = 1;
    });
    serveBall(Math.random() < 0.5 ? 0 : 1);
    ['#menu', '#over', '#pause'].forEach(s => $(s).classList.toggle('hidden', !demo || s !== '#menu'));
    $('#touchP2').style.visibility = game.mode === 'ai' ? 'hidden' : '';
    if (!demo) { if (document.activeElement) document.activeElement.blur(); banner('PRVNÍ NA ' + S().winScore + ' BODŮ VYHRÁVÁ!', '#00ffcc'); Sfx.whoosh(); }
}
function addScore(i, n = 1) {

    game.pop[i] = 1;
    if (game.scores[i] >= S().winScore) {
        if (game.demo) game.scores = [0, 0];

}

    for (let k = 0; k < 4; k++) {

            const x = rand(W * 0.2, W * 0.8), y = rand(H * 0.2, H * 0.8);

            ring(x, y, 200, p.color, { warp: 14 });

        }, k * 220);
    }
    Sfx.win();

        let c = i === w ? 10 : 4;
        c += 3 * (save.upg[i].greed || 0);
        if (i === w && game.scores[1 - i] === 0) c += 5;
        if (game.mode === 'ai') c = Math.round(c * AI_CFG[S().ai].coins);
        if (game.matchCons[i].c_double) c *= 2;

// ================= POWER-UPS =================
function poolTypes() { return Object.keys(POWERUPS).filter(t => game.demo || (isUnlocked(t) && !save.disabled[t])); }
function spawnBox() {
    const pool = poolTypes();
    if (!pool.length) return;
    let total = pool.reduce((s, t) => s + POWERUPS[t].w, 0), r = Math.random() * total, type = pool[0];
    for (const t of pool) { r -= POWERUPS[t].w; if (r <= 0) { type = t; break; } }
    let x, y, tries = 0;
    do {
        x = rand(W * 0.25, W * 0.75); y = rand(60, H - 60); tries++;
    } while (tries < 20 && (Math.hypot(x - W / 2, y - H / 2) < 70 || game.boxes.some(b => Math.hypot(b.x - x, b.y - y) < 90)));
    game.boxes.push({ x, y, type, size: 30, t: 0, life: 900 });
    ring(x, y, 70, POWERUPS[type].color, { v: 3 });
    burst(x, y, POWERUPS[type].color, 16, { speed: 3 });
}
function collectBox(k, i) {
    const bx = game.boxes[k];
    game.boxes.splice(k, 1);
    const c = POWERUPS[bx.type].color;
    burst(bx.x, bx.y, [c, '#ffffff'], 40, { speed: 6, shape: 'spark', size: 2 });
    ring(bx.x, bx.y, 110, c, { warp: 10 });
    addShake(4);
    play('power');
    applyPower(bx.type, i, bx.x, bx.y);
}
function applyPower(type, i, x, y) {
    const p = game.players[i], o = game.players[1 - i], def = POWERUPS[type];
    switch (type) {
        case 'LONG': setFx(p, 'long', 600); break;
        case 'SHORT': setFx(o, 'short', 600); break;
        case 'TURBO':
            for (const b of game.balls) {
                const sp = Math.hypot(b.vx, b.vy), ns = Math.min(sp * 1.4, ballCfg().max * 1.25);
                if (sp > 0) { b.vx *= ns / sp; b.vy *= ns / sp; }
                b.turbo = 220;
            }
            break;
        case 'POINT': addScore(i, 1); break;
        case 'ROCKETS': p.ammo += 3; break;
        case 'NUKE': launchNuke(i); return;
        case 'MULTI': {
            const src = game.balls[0];
            if (!src) break;
            const sp = Math.max(Math.hypot(src.vx, src.vy), ballCfg().base);

function fireRocket(p) {

    burst(x, y, ['#ffffff', '#ffcc00', '#ff6a00'], 16, { speed: 3.5, decay: 0.06, angle: dir > 0 ? 0 : Math.PI, spread: 0.7 });

}
function updateRockets() {
    for (let k = game.rockets.length - 1; k >= 0; k--) {

                const d = Math.hypot(b.x - r.x, b.y - r.y);
                if (d < bd) { bd = d; tgt = b; }
            }
            const tx = tgt ? tgt.x : opp.x + opp.w / 2, ty = tgt ? tgt.y : opp.y + opp.h / 2;
            let diff = Math.atan2(ty - r.y, tx - r.x) - ang;
            diff = Math.atan2(Math.sin(diff), Math.cos(diff));
            ang += clamp(diff, -0.075, 0.075);
        }
        r.vx = Math.cos(ang) * sp; r.vy = Math.sin(ang) * sp; r.ang = ang;
        r.x += r.vx; r.y += r.vy; r.life--;
        if (game.frame % 2 === 0) smoke(r.x - r.vx, r.y - r.vy, 1, { size: 4, speed: 0.4, decay: 0.02, grow: 0.15 });
        addP({ x: r.x - r.vx * 1.2, y: r.y - r.vy * 1.2, vx: -r.vx * 0.15 + rand(-0.4, 0.4), vy: -r.vy * 0.15 + rand(-0.4, 0.4), r: rand(2, 4), color: pick(['#ffcc00', '#ff6a00', '#ffffff']), a: 1, decay: 0.08, drag: 0.9, g: 0, glow: true, grow: -0.05, shape: 'dot' });

        if (!hit) for (const b of game.balls) if (b.wait <= 0 && Math.hypot(b.x - r.x, b.y - r.y) < b.r + 9) { hit = { ball: b }; break; }
        if (!hit && r.x > opp.x - 6 && r.x < opp.x + opp.w + 6 && r.y > opp.y - 6 && r.y < opp.y + opp.h + 6) hit = 'paddle';
        if (!hit) for (let j = game.boxes.length - 1; j >= 0; j--) {
            const bx = game.boxes[j];
            if (Math.hypot(bx.x - r.x, bx.y - r.y) < bx.size / 2 + 8) { collectBox(j, r.owner); hit = 'box'; break; }
        }
        if (!hit) for (let j = game.rockets.length - 1; j >= 0; j--) {
            const o = game.rockets[j];
            if (o !== r && o.owner !== r.owner && Math.hypot(o.x - r.x, o.y - r.y) < 14) {
                game.rockets.splice(j, 1);

}
function explode(x, y, owner, blast = 0, hit = null) {

// ================= UPDATE =================
function updateWorld() {
    const [bw, bh] = baseDims(), m = game.bigMap > 0 ? 1.4 : 1;
    const tw = bw * m, th = bh * m;
    if (Math.abs(tw - W) < 0.5 && Math.abs(th - H) < 0.5) { W = tw; H = th; return; }
    const nW = W + (tw - W) * 0.05, nH = H + (th - H) * 0.05;
    const sx = nW / W, sy = nH / H;
    const sc = o => { o.x *= sx; o.y *= sy; };
    game.balls.forEach(b => { sc(b); b.trail.forEach(sc); });
    game.boxes.forEach(sc); game.rockets.forEach(sc); game.decals.forEach(sc); game.emitters.forEach(sc);
    game.nukes.forEach(n => { sc(n); n.sx *= sx; n.sy *= sy; n.tx *= sx; n.ty *= sy; });
    if (game.blackHole) sc(game.blackHole);
    game.players.forEach(p => { p.y = (p.y + p.h / 2) * sy - p.h / 2; });
    W = nW; H = nH;
}

function updatePlayer(p) {
    const f = p.fx;
    for (const k in f) if (f[k] > 0) f[k]--;
    const th = p.baseH * (f.long ? 1.55 : 1) * (f.short ? 0.55 : 1) * (f.nuke ? 0.5 : 1) * Math.sqrt(H / 450);
    const cy = p.y + p.h / 2;
    p.h += (th - p.h) * 0.15;

    let dir = p.isAI ? aiDir(p) : humanDir(p.i);

    if (locked) dir = 0;
    if (f.invert) dir = -dir;
    const speed = p.baseSpeed * (f.slow ? 0.45 : 1) * Math.sqrt(H / 450) * (p.isAI ? aiCfg().speed : 1);
    p.vy += (dir * speed - p.vy) * 0.35;
    if (locked) p.vy *= 0.5;
    p.y += p.vy;
    if (p.y < 0) { p.y = 0; p.vy = 0; }
    if (p.y + p.h > H) { p.y = H - p.h; p.vy = 0; }

    if (p.fireCd > 0) p.fireCd--;
    if (p.isAI ? aiFire(p) : humanFire(p.i)) fireRocket(p);
    if (p.launcher && p.ammo < p.maxAmmo && ++p.regen >= p.regenTime) {
        p.ammo++; p.regen = 0;

    if (f.freeze && game.frame % 5 === 0) burst(cx, rand(p.y, p.y + p.h), ['#e0f7ff', '#7dd3fc'], 2, { speed: 1, size: 2, decay: 0.03 });

    p.trail.push(p.y);
    if (p.trail.length > 6) p.trail.shift();
}

function collidePaddle(b, p) {
    if (p.i === 0 ? b.vx >= 0 : b.vx <= 0) return;
    if (b.x - b.r < p.x + p.w && b.x + b.r > p.x && b.y + b.r > p.y && b.y - b.r < p.y + p.h) {

        const ang = hp * Math.PI / 3.2;

        const dir = p.i === 0 ? 1 : -1;

        b.vy = sp * Math.sin(ang);
        b.x = p.i === 0 ? p.x + p.w + b.r : p.x - b.r;
        b.last = p.i;
        b.spin = p.spin ? p.vy * 0.007 : 0;

function updateBalls() {
    const cfg = ballCfg();
    for (let k = game.balls.length - 1; k >= 0; k--) {
        const b = game.balls[k];
        if (b.wait > 0) {
            b.wait--;
            if (b.wait % 20 === 0) ring(b.x, b.y, 50, '#ffffff', { v: 2, w: 1.5 });

            if (game.frame % 2 === 0) burst(b.x, b.y, '#c084fc', 1, { speed: 0.5, size: 2, decay: 0.05 });

        if (Math.abs(b.vx) < 2.5) b.vx = (Math.sign(b.vx) || 1) * 2.5;
        let sp = Math.hypot(b.vx, b.vy);
        const cap = cfg.max * 1.35;
        if (sp > cap) { b.vx *= cap / sp; b.vy *= cap / sp; sp = cap; }

        const n = Math.max(1, Math.ceil(sp / 4));
        for (let s = 0; s < n; s++) {
            b.x += b.vx / n; b.y += b.vy / n;
            if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); wallFx(b); }
            else if (b.y > H - b.r) { b.y = H - b.r; b.vy = -Math.abs(b.vy); wallFx(b); }
            for (const p of game.players) {
                collidePaddle(b, p);
                if (p.shield > 0) {
                    const sx = p.i === 0 ? 8 : W - 8;
                    if ((p.i === 0 && b.x - b.r < sx && b.vx < 0) || (p.i === 1 && b.x + b.r > sx && b.vx > 0)) {

    }
}

function updateBoxes() {
    const rate = game.demo ? PU_RATE.normal : PU_RATE[S().puRate];
    const maxBoxes = (game.demo || save.unlocked.DOUBLE) ? 2 : 1;
    if (rate !== Infinity && game.boxes.length < maxBoxes && ++game.spawnT >= rate) {
        game.spawnT = -Math.floor(rand(0, rate * 0.3));
        spawnBox();
    }
    for (let k = game.boxes.length - 1; k >= 0; k--) {
        const bx = game.boxes[k];
        bx.t++;
        if (bx.t >= bx.life) {
            burst(bx.x, bx.y, POWERUPS[bx.type].color, 14, { speed: 2 });
            game.boxes.splice(k, 1);
        }
    }
}

function updateGlobals() {
    if (game.bigMap > 0 && --game.bigMap === 0) { banner('🗺️ Aréna se zmenšuje...', '#22d3ee'); play('whoosh'); }
    if (game.ghost && --game.ghost.t <= 0) game.ghost = null;
    const bh = game.blackHole;
    if (bh) {
        bh.t--; bh.age++; bh.rot += 0.06;
        if (game.frame % 2 === 0) {
            const a = Math.random() * Math.PI * 2, d = rand(80, 140);
            addP({ x: bh.x + Math.cos(a) * d, y: bh.y + Math.sin(a) * d, vx: -Math.cos(a) * 2 - Math.sin(a) * 2.5, vy: -Math.sin(a) * 2 + Math.cos(a) * 2.5,
                r: rand(1, 2.5), color: pick(['#a855f7', '#ec4899', '#f0abfc']), a: 1, decay: 0.025, drag: 0.98, g: 0, glow: true, grow: 0, shape: 'dot' });
        }
        if (bh.t <= 0) {
            burst(bh.x, bh.y, ['#a855f7', '#ec4899', '#ffffff'], 80, { speed: 8 });
            ring(bh.x, bh.y, 300, '#a855f7', { warp: 30 });
            addShake(10);
            game.blackHole = null;
        }
    }
}

function updateEffects() {
    if (game.banner && ++game.banner.t >= game.banner.life) game.banner = null;
    const ps = game.particles;
    for (let k = ps.length - 1; k >= 0; k--) {
        const p = ps[k];
        p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g;
        p.x += p.vx; p.y += p.vy; p.r += p.grow; p.a -= p.decay;
        if (p.a <= 0 || p.r <= 0.2) { ps[k] = ps[ps.length - 1]; ps.pop(); }
    }
    for (let k = game.rings.length - 1; k >= 0; k--) {
        const r = game.rings[k];
        r.r += r.v; r.a = 1 - r.r / r.max;
        if (r.a <= 0) game.rings.splice(k, 1);
    }
    for (let k = game.texts.length - 1; k >= 0; k--) {
        const t = game.texts[k];
        t.t++; t.y -= 0.5;
        if (t.t >= t.life) game.texts.splice(k, 1);
    }
    for (let k = game.decals.length - 1; k >= 0; k--) {
        const d = game.decals[k];
        d.a -= d.d;
        if (d.a <= 0) game.decals.splice(k, 1);
    }
    for (let k = game.emitters.length - 1; k >= 0; k--) {
        const e = game.emitters[k];
        e.t++;
        const rise = Math.min(e.t * 1.6, 150), capY = e.y - rise;
        const heat = 1 - e.t / e.life;
        // stem
        smoke(e.x + rand(-14, 14), e.y - rise * Math.random(), 1, { size: 9, speed: 0.4, vy: -1.2, decay: 0.012, color: heat > 0.6 ? ['#7a3410', '#5a2a14'] : ['#3a3a48', '#2a2a35'] });
        // mushroom cap
        smoke(e.x + rand(-20, 20), capY, 2, { size: 14, speed: 2.2, vy: -0.4, decay: 0.009, grow: 0.35, color: heat > 0.5 ? ['#8a3a12', '#6b2c10', '#4a4a58'] : ['#4a4a58', '#3a3a48'] });
        if (heat > 0.3) burst(e.x + rand(-25, 25), capY + rand(-10, 20), ['#ff8c00', '#ffd23f', '#ff3d00'], 2, { speed: 1.5, size: 5, decay: 0.04, vy: -0.6 });
        if (e.t % 3 === 0) burst(e.x, e.y, ['#ffd23f', '#ff6a00'], 1, { speed: 5, size: 1.5, decay: 0.02, gravity: 0.1, vy: -4, shape: 'spark' });
        if (e.t >= e.life) game.emitters.splice(k, 1);
    }
}

function step() {
    game.frame++;
    if (game.state === 'PLAYING') {
        updateWorld();
        game.players.forEach(updatePlayer);
        updateBalls();
        if (game.state === 'PLAYING') {
            updateRockets();
            updateNukes();
            updateBoxes();
            updateGlobals();
        }
    }
    updateEffects();
}

// ================= RENDER =================
const view = { cw: 0, ch: 0, dpr: 1 };
function resize() {
    const r = wrap.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    view.cw = canvas.width; view.ch = canvas.height; view.dpr = dpr;
}
new ResizeObserver(resize).observe(wrap);
resize();

function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}
function zigzag(x1, y1, x2, y2, seg = 6, amp = 6) {
    ctx.beginPath(); ctx.moveTo(x1, y1);
    for (let i = 1; i < seg; i++) {
        const t = i / seg;
        ctx.lineTo(x1 + (x2 - x1) * t + rand(-amp, amp), y1 + (y2 - y1) * t + rand(-amp, amp));
    }
    ctx.lineTo(x2, y2); ctx.stroke();
}
function warp(x, y) {
    let dx = 0, dy = 0;
    for (const r of game.rings) {
        if (!r.warp) continue;
        const ex = x - r.x, ey = y - r.y, d = Math.hypot(ex, ey) || 1, diff = d - r.r;
        if (diff > -50 && diff < 50) {
            const f = (1 - Math.abs(diff) / 50) * r.warp * r.a;
            dx += ex / d * f; dy += ey / d * f;
        }
    }
    const bh = game.blackHole;
    if (bh) {
        const ex = x - bh.x, ey = y - bh.y, d = Math.hypot(ex, ey) || 1;
        if (d < bh.range) {
            const f = Math.min(d * 0.7, (1 - d / bh.range) * 40 * Math.min(1, bh.age / 30, bh.t / 30));
            dx -= ex / d * f; dy -= ey / d * f;
        }
    }
    return [x + dx, y + dy];
}

function drawArena() {
    ctx.fillStyle = '#070816';
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, 'rgba(0,255,204,0.07)');
    g.addColorStop(0.5, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(255,45,149,0.07)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    if (game.tint > 0) {
        ctx.fillStyle = `rgba(255,60,0,${game.tint * 0.25})`;
        ctx.fillRect(0, 0, W, H);
    }

    // warped grid
    const gs = 40;
    ctx.lineWidth = 1;
    ctx.strokeStyle = `rgba(90,110,255,${0.09 + game.gridPulse * 0.25})`;
    for (let x = 0; x <= W + 1; x += gs) {
        ctx.beginPath();
        for (let y = 0; y <= H + 20; y += 20) {
            const [px, py] = warp(x, Math.min(y, H));
            y === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.stroke();
    }
    for (let y = 0; y <= H + 1; y += gs) {
        ctx.beginPath();
        for (let x = 0; x <= W + 20; x += 20) {
            const [px, py] = warp(Math.min(x, W), y);
            x === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.stroke();
    }

    // center line + circle
    ctx.save();
    ctx.strokeStyle = 'rgba(0,255,204,0.25)';
    ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 8;
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 14]);
    ctx.lineDashOffset = -game.frame * 0.4;
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    // goal flashes
    for (let i = 0; i < 2; i++) {
        const a = game.goalFlash[i];
        if (a <= 0.01) continue;
        const col = game.players[1 - i] ? game.players[1 - i].color : '#fff';
        const x0 = i === 0 ? 0 : W, gg = ctx.createLinearGradient(x0, 0, i === 0 ? 220 : W - 220, 0);
        gg.addColorStop(0, col); gg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = a * 0.7;
        ctx.fillStyle = gg;
        ctx.fillRect(i === 0 ? 0 : W - 220, 0, 220, H);
        ctx.globalAlpha = 1;
    }

    // walls
    ctx.save();
    ctx.strokeStyle = '#4f5bd5'; ctx.shadowColor = '#6d7bff'; ctx.shadowBlur = 12; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 1.5); ctx.lineTo(W, 1.5); ctx.moveTo(0, H - 1.5); ctx.lineTo(W, H - 1.5); ctx.stroke();
    ctx.restore();
}

function drawDecals() {
    for (const d of game.decals) {
        const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
        g.addColorStop(0, `rgba(0,0,0,${0.7 * d.a})`);
        g.addColorStop(0.6, `rgba(30,10,0,${0.5 * d.a})`);
        g.addColorStop(0.85, `rgba(255,90,0,${0.25 * d.a * d.a})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    }
}

function drawBlackHole() {
    const h = game.blackHole;
    if (!h) return;
    const k = Math.min(1, h.age / 30, h.t / 30);
    ctx.save();
    ctx.translate(h.x, h.y);
    const R = 95 * k;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.3, 'rgba(15,0,30,1)');
    g.addColorStop(0.5, 'rgba(168,85,247,0.6)');
    g.addColorStop(1, 'rgba(168,85,247,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
        ctx.strokeStyle = i % 2 ? 'rgba(236,72,153,0.55)' : 'rgba(168,85,247,0.65)';
        ctx.lineWidth = 2.5 - i * 0.25;
        const rr2 = (24 + i * 11) * k, a0 = h.rot * (1.6 - i * 0.18) + i * 1.3;
        ctx.beginPath(); ctx.arc(0, 0, rr2, a0, a0 + Math.PI * 0.9); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(0, 0, 17 * k, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#f0abfc'; ctx.lineWidth = 1.5; ctx.shadowColor = '#f0abfc'; ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.restore();
}

function drawBoxes() {
    for (const bx of game.boxes) {
        const def = POWERUPS[bx.type];
        const ap = Math.min(1, bx.t / 22), ease = 1 + 2.70158 * Math.pow(ap - 1, 3) + 1.70158 * Math.pow(ap - 1, 2);
        const s = (bx.size + Math.sin(bx.t * 0.1) * 2.5) * ease;
        const blink = bx.life - bx.t < 150 && game.frame % 12 < 6;
        ctx.save();
        ctx.globalAlpha = blink ? 0.35 : 1;
        ctx.translate(bx.x, bx.y);
        // orbit sparkles
        ctx.fillStyle = def.color;
        for (let k = 0; k < 3; k++) {
            const a = bx.t * 0.06 + k * 2.094;
            ctx.beginPath(); ctx.arc(Math.cos(a) * s * 0.95, Math.sin(a) * s * 0.95, 2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.rotate(Math.sin(bx.t * 0.035) * 0.3);
        ctx.shadowColor = def.color; ctx.shadowBlur = 24;
        ctx.fillStyle = '#0b0d1c'; ctx.strokeStyle = def.color; ctx.lineWidth = 3;
        rr(-s / 2, -s / 2, s, s, 7); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        const ig = ctx.createLinearGradient(0, -s / 2, 0, s / 2);
        ig.addColorStop(0, def.color + '55'); ig.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = ig;
        rr(-s / 2 + 3, -s / 2 + 3, s - 6, s - 6, 5); ctx.fill();
        ctx.font = `${Math.round(s * 0.55)}px ${EMOJI_FONT}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.fillText(def.icon, 0, 1);
        ctx.restore();
    }
}

function drawShields() {
    for (const p of game.players) {
        if (p.shield <= 0) continue;
        const x = p.i === 0 ? 8 : W - 8;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.55 + Math.sin(game.frame * 0.15) * 0.2;
        ctx.strokeStyle = '#60a5fa'; ctx.shadowColor = '#60a5fa'; ctx.shadowBlur = 20;
        ctx.lineWidth = 2 + p.shield * 1.5;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        ctx.lineWidth = 1;
        const off = (game.frame * 0.6) % 26;
        for (let y = -26 + off; y < H; y += 26) {
            ctx.beginPath();
            for (let k = 0; k < 6; k++) {
                const a = k * Math.PI / 3, px = x + Math.cos(a) * 7, py = y + Math.sin(a) * 7;
                k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
            }
            ctx.closePath(); ctx.stroke();
        }
        ctx.restore();
    }
}

function drawPaddle(p) {
    const f = p.fx, sq = p.squash;
    const w = p.w * (1 + sq * 0.4), h = p.h * (1 - sq * 0.07);
    const dir = p.i === 0 ? 1 : -1;
    const x = p.x + p.w / 2 - w / 2 - dir * p.recoil, y = p.y + p.h / 2 - h / 2;
    let col = p.color;
    if (f.freeze) col = '#bfefff';
    else if (f.stun) col = game.frame % 6 < 3 ? '#fff7a0' : '#6b7280';
    else if (f.nuke) col = game.frame % 20 < 10 ? '#d9f99d' : p.color;

    ctx.save();
    // afterimages
    ctx.fillStyle = col;
    for (let k = 0; k < p.trail.length - 1; k++) {
        ctx.globalAlpha = 0.06 * (k + 1);
        rr(x, p.trail[k] + p.h / 2 - h / 2, w, h, 5); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowColor = col; ctx.shadowBlur = 22;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, col); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, col);
    ctx.fillStyle = col;
    rr(x, y, w, h, 6); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = g;
    rr(x + w * 0.25, y + 5, w * 0.5, h - 10, 3); ctx.fill();
    ctx.globalAlpha = 1;
    if (p.flash > 0.02) {
        ctx.globalAlpha = p.flash;
        ctx.fillStyle = '#ffffff';
        rr(x - 2, y - 2, w + 4, h + 4, 7); ctx.fill();
        ctx.globalAlpha = 1;
    }
    if (f.freeze) {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        rr(x - 4, y - 4, w + 8, h + 8, 6); ctx.stroke();
        ctx.fillStyle = 'rgba(200,240,255,0.8)';
        for (let k = 0; k < 5; k++) {
            const sy = y + (k + 0.5) * h / 5, sx = k % 2 ? x - 6 : x + w + 6;
            ctx.beginPath(); ctx.moveTo(sx, sy - 6); ctx.lineTo(sx + (k % 2 ? -5 : 5), sy); ctx.lineTo(sx, sy + 6); ctx.fill();
        }
    }
    if (f.stun) {
        ctx.strokeStyle = '#ffee00'; ctx.lineWidth = 2; ctx.shadowColor = '#ffee00'; ctx.shadowBlur = 10;
        for (let k = 0; k < 3; k++) zigzag(x + w / 2 + rand(-12, 12), y - 8, x + w / 2 + rand(-12, 12), y + h + 8, 8, 7);
        ctx.shadowBlur = 0;
        ctx.font = `14px ${EMOJI_FONT}`; ctx.textAlign = 'center';
        for (let k = 0; k < 3; k++) {
            const a = game.frame * 0.12 + k * 2.09;
            ctx.fillText('⭐', x + w / 2 + Math.cos(a) * 18, y - 14 + Math.sin(a) * 5);
        }
    }
    if (f.invert) {
        ctx.font = `16px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.save(); ctx.translate(x + w / 2, y - 16); ctx.rotate(game.frame * 0.1); ctx.fillText('🔄', 0, 0); ctx.restore();
        ctx.strokeStyle = '#e879f9'; ctx.globalAlpha = 0.5 + Math.sin(game.frame * 0.3) * 0.4; ctx.lineWidth = 2;
        rr(x - 3, y - 3, w + 6, h + 6, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (f.slow) {
        ctx.fillStyle = 'rgba(163,230,53,0.45)';
        rr(x - 2, y + h * 0.6, w + 4, h * 0.4 + 2, 5); ctx.fill();
    }
    // ammo pips behind paddle
    const bx = p.i === 0 ? x - 8 : x + w + 8;
    for (let k = 0; k < p.ammo && k < 8; k++) {
        ctx.fillStyle = '#ff3d81'; ctx.shadowColor = '#ff3d81'; ctx.shadowBlur = 6;
        rr(bx - 2, y + 4 + k * 9, 4, 6, 2); ctx.fill();
    }
    ctx.restore();
}

function ballAlpha(b) {
    const g = game.ghost;
    if (!g || b.wait > 0) return 1;
    const away = g.owner === 0 ? b.vx > 0 : b.vx < 0;
    if (!away) return 1;
    const opp = game.players[1 - g.owner];
    const d = Math.abs(b.x - (opp.x + opp.w / 2));
    return d < 110 ? 0.9 : 0.05 + (Math.sin(game.frame * 0.5) > 0.85 ? 0.25 : 0);
}
function drawBall(b) {
    const cfg = ballCfg(), sp = Math.hypot(b.vx, b.vy), heat = sp / cfg.max;
    const col = b.turbo > 0 ? '#ffb300' : heat < 0.55 ? '#ffffff' : heat < 0.8 ? '#fff176' : heat < 1 ? '#ffb300' : '#ff3d00';
    const alpha = ballAlpha(b);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = 1; i < b.trail.length; i++) {
        const t = i / b.trail.length;
        ctx.globalAlpha = alpha * t * 0.45;
        ctx.strokeStyle = col;
        ctx.lineWidth = b.r * 2 * t;
        ctx.beginPath(); ctx.moveTo(b.trail[i - 1].x, b.trail[i - 1].y); ctx.lineTo(b.trail[i].x, b.trail[i].y); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = alpha;
    if (b.wait > 0) {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + b.wait * 0.7, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 0.5 + Math.sin(game.frame * 0.4) * 0.5;
    }
    ctx.shadowColor = col; ctx.shadowBlur = 22;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function drawRocket(r) {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.ang);
    const col = game.players[r.owner].color;

function drawNuke(n) {
    const R = 210;
    // target zone
    ctx.save();
    const blink = game.frame % 16 < 8;
    ctx.strokeStyle = blink ? '#ff1a1a' : '#ff8888';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = game.frame;
    ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(n.tx, n.ty, R, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = `rgba(255,0,0,${0.06 + (blink ? 0.06 : 0)})`;
    ctx.fill();
    const k = n.t / n.dur;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(n.tx, n.ty, 34, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(n.tx - 48, n.ty); ctx.lineTo(n.tx - 18, n.ty); ctx.moveTo(n.tx + 18, n.ty); ctx.lineTo(n.tx + 48, n.ty);
    ctx.moveTo(n.tx, n.ty - 48); ctx.lineTo(n.tx, n.ty - 18); ctx.moveTo(n.tx, n.ty + 18); ctx.lineTo(n.tx, n.ty + 48);
    ctx.stroke();
    ctx.font = `22px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('☢️', n.tx, n.ty);
    ctx.restore();

    // shadow on ground
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(n.x, n.y + 10 + n.alt * 40, 16 - n.alt * 6, 6 - n.alt * 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // missile
    const sc = 1.3 + n.alt * 1.1;
    ctx.save();
    ctx.translate(n.x, n.y - n.alt * 40);
    ctx.rotate(n.ang);
    ctx.scale(sc, sc);
    ctx.globalCompositeOperation = 'lighter';
    const fl = rand(14, 24);
    ctx.fillStyle = '#ff8c00';
    ctx.beginPath(); ctx.moveTo(-12, -5); ctx.lineTo(-12 - fl, 0); ctx.lineTo(-12, 5); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-12, -2.5); ctx.lineTo(-12 - fl * 0.5, 0); ctx.lineTo(-12, 2.5); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowColor = '#ff1a1a'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#3f3f46';
    ctx.beginPath(); ctx.moveTo(-12, -5); ctx.lineTo(-17, -11); ctx.lineTo(-5, -5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-12, 5); ctx.lineTo(-17, 11); ctx.lineTo(-5, 5); ctx.fill();
    ctx.fillStyle = '#facc15';
    rr(-13, -5, 22, 10, 4); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.fillRect(-6, -5, 3, 10); ctx.fillRect(0, -5, 3, 10);
    ctx.fillStyle = '#ff1a1a';
    ctx.beginPath(); ctx.moveTo(9, -5); ctx.lineTo(18, 0); ctx.lineTo(9, 5); ctx.fill();
    ctx.restore();
}

function drawParticles(glow) {
    ctx.save();
    ctx.globalCompositeOperation = glow ? 'lighter' : 'source-over';
    ctx.lineCap = 'round';
    for (const p of game.particles) {
        if (p.glow !== glow) continue;
        ctx.globalAlpha = Math.min(1, p.a);
        if (p.shape === 'spark') {
            ctx.strokeStyle = p.color; ctx.lineWidth = p.r;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.5, p.y - p.vy * 2.5); ctx.stroke();
        } else {
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
    }
    ctx.restore();
}

function drawRings() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const r of game.rings) {
        ctx.globalAlpha = r.a;
        ctx.strokeStyle = r.color;
        ctx.lineWidth = r.w * r.a + 0.5;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
}

function drawTexts() {
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const t of game.texts) {
        const k = t.t / t.life, pop = k < 0.15 ? 0.5 + k / 0.15 * 0.7 : 1.2 - Math.min(0.2, (k - 0.15));
        ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
        ctx.font = `${Math.round(t.size * pop)}px "Press Start 2P", ${EMOJI_FONT}`;
        ctx.shadowColor = t.color; ctx.shadowBlur = 12;
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
    }
    ctx.restore();
}

function drawHUD(hw, hh) {
    ctx.save();
    ctx.textBaseline = 'middle';
    // scores
    for (let i = 0; i < 2; i++) {
        const p = game.players[i];
        if (!p) continue;
        const pop = 1 + game.pop[i] * 0.6;
        ctx.save();
        ctx.translate(hw / 2 + (i === 0 ? -70 : 70), 46);
        ctx.scale(pop, pop);
        ctx.font = '34px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.shadowColor = p.color; ctx.shadowBlur = 18 + game.pop[i] * 30;
        ctx.fillStyle = game.pop[i] > 0.5 ? '#ffffff' : p.color;
        ctx.globalAlpha = 0.9;
        ctx.fillText(String(game.scores[i]), 0, 0);
        ctx.restore();
    }
    if (!game.demo && game.state !== 'OVER') {
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(200,210,255,0.4)';
        ctx.fillText(`DO ${S().winScore}`, hw / 2, 78);
    }

    // per-player status
    for (let i = 0; i < 2; i++) {
        const p = game.players[i];
        if (!p) continue;
        const sgn = i === 0 ? 1 : -1;
        let x = i === 0 ? 16 : hw - 16;
        const items = Object.keys(FX_INFO).filter(k => p.fx[k] > 0);
        ctx.font = `16px ${EMOJI_FONT}`;
        ctx.textAlign = 'center';
        for (const k of items) {
            const cx = x + sgn * 13;
            ctx.globalAlpha = 1;
            ctx.fillText(FX_INFO[k].icon, cx, 20);
            ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(cx - 11, 33, 22, 3);
            ctx.fillStyle = FX_INFO[k].color; ctx.fillRect(cx - 11, 33, 22 * p.fx[k] / (p.fxMax[k] || p.fx[k]), 3);
            ctx.fillStyle = '#fff';
            x += sgn * 30;
        }
        // rockets & shield row
        let x2 = i === 0 ? 16 : hw - 16;
        ctx.font = '9px "Press Start 2P", monospace';
        ctx.textAlign = i === 0 ? 'left' : 'right';
        const parts = [];
        if (p.launcher || p.ammo > 0) parts.push(`🚀${p.ammo}`);
        if (p.shield > 0) parts.push(`🛡️${p.shield}`);
        if (parts.length) {
            ctx.font = `13px ${EMOJI_FONT}`;
            ctx.fillStyle = p.color;
            ctx.fillText(parts.join('  '), x2, items.length ? 50 : 22);
            if (p.launcher && p.ammo < p.maxAmmo) {
                const by = (items.length ? 50 : 22) + 11;
                ctx.fillStyle = 'rgba(255,255,255,0.12)';
                ctx.fillRect(i === 0 ? x2 : x2 - 40, by, 40, 2);
                ctx.fillStyle = '#ff3d81';
                ctx.fillRect(i === 0 ? x2 : x2 - 40, by, 40 * p.regen / p.regenTime, 2);
            }
        }
    }

    // global effects
    const globals = [];
    if (game.bigMap > 0) globals.push(['🗺️', game.bigMap / 900, '#22d3ee']);
    if (game.blackHole) globals.push(['🕳️', game.blackHole.t / game.blackHole.max, '#a855f7']);
    if (game.ghost) globals.push(['👻', game.ghost.t / game.ghost.max, '#cbd5e1']);
    if (globals.length) {
        let gx = hw / 2 - (globals.length - 1) * 17;
        ctx.font = `16px ${EMOJI_FONT}`; ctx.textAlign = 'center';
        for (const [ic, k, c] of globals) {
            ctx.fillStyle = '#fff'; ctx.fillText(ic, gx, hh - 26);
            ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(gx - 12, hh - 13, 24, 3);
            ctx.fillStyle = c; ctx.fillRect(gx - 12, hh - 13, 24 * k, 3);
            gx += 34;
        }
    }

    // rally
    if (game.rally >= 5 && game.state === 'PLAYING') {
        ctx.font = '9px "Press Start 2P", monospace'; ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(255,210,63,${0.5 + Math.sin(game.frame * 0.2) * 0.3})`;
        ctx.fillText(`RALLY ${game.rally}`, hw / 2, globals.length ? hh - 50 : hh - 18);
    }

    // banner
    const bn = game.banner;
    if (bn && !game.demo) {
        const k = bn.t / bn.life;
        const a = k < 0.1 ? k / 0.1 : k > 0.8 ? (1 - k) / 0.2 : 1;
        {
            ctx.globalAlpha = a;
            ctx.font = '11px "Press Start 2P", ' + EMOJI_FONT;
            ctx.textAlign = 'center';
            const tw = ctx.measureText(bn.text).width + 30;
            const by = 108 - (1 - a) * 10;
            ctx.fillStyle = 'rgba(0,0,0,0.65)';
            rr(hw / 2 - tw / 2, by - 16, tw, 32, 8); ctx.fill();
            ctx.strokeStyle = bn.color; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.shadowColor = bn.color; ctx.shadowBlur = 12;
            ctx.fillStyle = bn.color;
            ctx.fillText(bn.text, hw / 2, by + 1);
        }
    }
    ctx.restore();
}

function render() {
    const { cw, ch } = view;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#020309';
    ctx.fillRect(0, 0, cw, ch);
    const s = Math.min(cw / W, ch / H) * game.zoom;
    const sh = game.shake * S().shake * (game.demo ? 0.3 : 1);
    const ox = (cw - W * s) / 2 + rand(-1, 1) * sh * s, oy = (ch - H * s) / 2 + rand(-1, 1) * sh * s;
    ctx.setTransform(s, 0, 0, s, ox, oy);

    drawArena();
    drawDecals();
    drawBlackHole();
    drawParticles(false);
    drawBoxes();
    drawShields();
    game.players.forEach(drawPaddle);
    game.balls.forEach(drawBall);
    game.rockets.forEach(drawRocket);
    game.nukes.forEach(drawNuke);
    drawParticles(true);
    drawRings();
    drawTexts();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (game.flash > 0.01) {
        ctx.globalAlpha = Math.min(1, game.flash);
        ctx.fillStyle = game.flashColor;
        ctx.fillRect(0, 0, cw, ch);
        ctx.globalAlpha = 1;
    }
    if (game.tint > 0.01) {
        const g = ctx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.2, cw / 2, ch / 2, Math.max(cw, ch) * 0.7);
        g.addColorStop(0, 'rgba(255,80,0,0)');
        g.addColorStop(1, `rgba(255,30,0,${game.tint * 0.55})`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, cw, ch);
    }
    const hs = cw / 800;
    ctx.setTransform(hs, 0, 0, hs, 0, 0);
    drawHUD(800, ch / hs);
}

// ================= LOOP =================
let last = performance.now(), acc = 0;
function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (game.state !== 'PAUSED') {
        acc += dt * 60 * (game.slowmo > 0 ? 0.35 : 1);
        let n = 0;
        while (acc >= 1 && n < 6) {
            acc -= 1; n++;
            if (game.hitstop > 0) { game.hitstop--; continue; }
            if (game.slowmo > 0) game.slowmo--;
            step();
        }
        if (n >= 6) acc = 0;
        const k = dt * 60;
        game.flash = Math.max(0, game.flash - 0.022 * k);
        game.tint = Math.max(0, game.tint - 0.006 * k);
        game.shake *= Math.pow(0.88, k);
        game.zoom = 1 + (game.zoom - 1) * Math.pow(0.93, k);
        game.gridPulse *= Math.pow(0.95, k);
        game.goalFlash = game.goalFlash.map(v => v * Math.pow(0.92, k));
        game.pop = game.pop.map(v => v * Math.pow(0.88, k));
    }
    render();
    requestAnimationFrame(frame);
}

// ================= UI =================
function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.tm);
    toast.tm = setTimeout(() => t.classList.remove('show'), 1800);
}
function updateWallets() {
    $('#coins1').textContent = save.coins[0];
    $('#coins2').textContent = save.coins[1];
    document.querySelectorAll('#modeGroup .seg').forEach(b => b.classList.toggle('on', b.dataset.mode === S().mode));
    wrap.classList.toggle('crt', !!S().crt);
}
function openModal(id) {
    $('#' + id).classList.remove('hidden');
    if (id === 'shop') renderShop();
    if (id === 'settings') renderSettings();
    Sfx.click();
}
function closeModal(id) { $('#' + id).classList.add('hidden'); updateWallets(); Sfx.click(); }

let shopTab = 0;
function renderShop() {
    $('#shopCoins').innerHTML = `<div class="wallet p1">P1 <b>${save.coins[0]}</b> 🪙</div><div class="wallet p2">P2 <b>${save.coins[1]}</b> 🪙</div>`;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', +t.dataset.tab === shopTab));
    let html = '';
    if (shopTab < 2) {
        const i = shopTab, c = i ? 'var(--p2)' : 'var(--p1)';
        html += `<h3>TRVALÁ VYLEPŠENÍ</h3><div class="grid">`;
        for (const u of UPGRADES) {
            const lvl = save.upg[i][u.id] || 0, maxed = lvl >= u.max, cost = maxed ? 0 : u.cost[lvl];
            const reqOk = !u.req || save.upg[i][u.req], afford = save.coins[i] >= cost;
            const pips = Array.from({ length: u.max }, (_, k) => `<i class="${k < lvl ? 'on' : ''}"></i>`).join('');
            const reqName = u.req ? UPGRADES.find(x => x.id === u.req).name : '';
            const label = maxed ? '✔ MAX' : !reqOk ? `🔒 ${reqName}` : `${cost} 🪙`;
            html += `<div class="card ${maxed ? 'maxed' : ''}" style="--c:${c}">
                <div class="card-top"><span class="ic">${u.icon}</span><div><div class="nm">${u.name}</div><div class="pips">${pips}</div></div></div>
                <p>${u.desc}</p>
                <button class="buy ${afford || maxed ? '' : 'dim'}" data-buy="upg" data-id="${u.id}" data-p="${i}" ${maxed || !reqOk ? 'disabled' : ''}>${label}</button></div>`;
        }
        html += `</div><h3>JEDNORÁZOVÉ (PLATÍ NA PŘÍŠTÍ ZÁPAS)</h3><div class="grid">`;
        for (const it of CONSUMABLES) {
            const owned = !!save.cons[i][it.id], afford = save.coins[i] >= it.cost;
            html += `<div class="card ${owned ? 'maxed' : ''}" style="--c:${c}">
                <div class="card-top"><span class="ic">${it.icon}</span><div><div class="nm">${it.name}</div><span class="tag buff">1 ZÁPAS</span></div></div>
                <p>${it.desc}</p>
                <button class="buy ${afford || owned ? '' : 'dim'}" data-buy="cons" data-id="${it.id}" data-p="${i}" ${owned ? 'disabled' : ''}>${owned ? '✔ PŘIPRAVENO' : it.cost + ' 🪙'}</button></div>`;
        }
        html += '</div>';
    } else {
        html += `<p class="note">Odemčené power-upy se začnou objevovat na hřišti pro oba hráče. Zaplatit může kterýkoli z vás. V nastavení je pak můžeš zapínat a vypínat.</p>`;
        html += `<h3>POWER-UPY</h3><div class="grid">`;
        for (const [id, d] of Object.entries(POWERUPS)) {
            const un = isUnlocked(id);
            const btns = d.base ? `<button class="buy" disabled>★ ZÁKLAD</button>`
                : un ? `<button class="buy" disabled>✔ ODEMČENO</button>`
                : `<div class="buy-row"><button class="buy p1 ${save.coins[0] >= d.cost ? '' : 'dim'}" data-buy="arena" data-id="${id}" data-p="0">P1 · ${d.cost} 🪙</button><button class="buy p2 ${save.coins[1] >= d.cost ? '' : 'dim'}" data-buy="arena" data-id="${id}" data-p="1">P2 · ${d.cost} 🪙</button></div>`;
            html += `<div class="card ${un ? 'maxed' : ''}" style="--c:${d.color}">
                <div class="card-top"><span class="ic">${d.icon}</span><div><div class="nm">${d.name}</div><span class="tag ${d.kind}">${d.kind.toUpperCase()}</span></div></div>
                <p>${d.desc}</p>${btns}</div>`;
        }
        html += `</div><h3>VYLEPŠENÍ ARÉNY</h3><div class="grid">`;
        for (const d of ARENA_EXTRAS) {
            const un = !!save.unlocked[d.id];
            const btns = un ? `<button class="buy" disabled>✔ ODEMČENO</button>`
                : `<div class="buy-row"><button class="buy p1 ${save.coins[0] >= d.cost ? '' : 'dim'}" data-buy="arena" data-id="${d.id}" data-p="0">P1 · ${d.cost} 🪙</button><button class="buy p2 ${save.coins[1] >= d.cost ? '' : 'dim'}" data-buy="arena" data-id="${d.id}" data-p="1">P2 · ${d.cost} 🪙</button></div>`;
            html += `<div class="card ${un ? 'maxed' : ''}" style="--c:var(--gold)">
                <div class="card-top"><span class="ic">${d.icon}</span><div><div class="nm">${d.name}</div><span class="tag perm">TRVALÉ</span></div></div>
                <p>${d.desc}</p>${btns}</div>`;
        }
        html += '</div>';
    }
    $('#shopBody').innerHTML = html;
}
function buy(kind, id, i, btn) {
    let cost;
    if (kind === 'upg') { const u = UPGRADES.find(x => x.id === id); cost = u.cost[save.upg[i][id] || 0]; }
    else if (kind === 'cons') cost = CONSUMABLES.find(x => x.id === id).cost;
    else cost = (POWERUPS[id] || ARENA_EXTRAS.find(x => x.id === id)).cost;
    if (save.coins[i] < cost) {
        const card = btn.closest('.card');
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        Sfx.bad();
        toast(`Hráč ${i + 1} nemá dost mincí (${save.coins[i]}/${cost})`);
        return;
    }
    save.coins[i] -= cost;
    if (kind === 'upg') save.upg[i][id] = (save.upg[i][id] || 0) + 1;
    else if (kind === 'cons') save.cons[i][id] = 1;
    else save.unlocked[id] = true;
    persist();
    Sfx.coin();
    toast('✔ Koupeno!');
    renderShop();
    updateWallets();
}

function renderSettings() {
    const s = S();
    let html = '';
    for (const it of SETTINGS_UI) {
        html += `<div class="set-row"><div class="set-label">${it.label}</div><div class="seg-group">`;
        it.opts.forEach(([v, l], idx) => {
            const locked = it.key === 'arena' && v === 'xl' && !save.unlocked.XL;
            html += `<button class="seg ${s[it.key] === v ? 'on' : ''} ${locked ? 'locked' : ''}" data-set="${it.key}" data-idx="${idx}">${locked ? '🔒 ' : ''}${l}</button>`;
        });
        html += '</div></div>';
    }
    html += `<div class="set-row"><div class="set-label">Power-upy ve hře<br><span class="note">klikni pro zap/vyp</span></div><div class="seg-group">`;
    for (const [id, d] of Object.entries(POWERUPS)) {
        const un = isUnlocked(id), off = !!save.disabled[id];
        html += `<button class="seg ${un && !off ? 'on' : ''} ${!un ? 'locked' : ''} ${un && off ? 'off' : ''}" data-pu="${id}">${un ? '' : '🔒 '}${d.icon} ${d.name}</button>`;
    }
    html += `</div></div>
        <div class="set-row"><div class="set-label">Postup</div><div class="seg-group"><button class="btn red" id="resetBtn">⚠ SMAZAT VŠE (mince, vylepšení)</button></div></div>`;
    $('#setBody').innerHTML = html;
}

// UI events
$('#playBtn').addEventListener('click', () => { Sfx.init(); Sfx.resume(); startMatch(false); });
$('#againBtn').addEventListener('click', () => startMatch(false));
$('#menuBtn').addEventListener('click', goToMenu);
$('#quitBtn').addEventListener('click', goToMenu);
$('#resumeBtn').addEventListener('click', togglePause);
$('#shopBtn').addEventListener('click', () => openModal('shop'));
$('#overShopBtn').addEventListener('click', () => openModal('shop'));
$('#setBtn').addEventListener('click', () => openModal('settings'));
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModal(m.id); }));
document.querySelectorAll('#modeGroup .seg').forEach(b => b.addEventListener('click', () => {
    S().mode = b.dataset.mode; persist(); updateWallets(); Sfx.click();
}));
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { shopTab = +t.dataset.tab; renderShop(); Sfx.click(); }));
$('#shopBody').addEventListener('click', e => {
    const b = e.target.closest('[data-buy]');
    if (b && !b.disabled) buy(b.dataset.buy, b.dataset.id, +b.dataset.p, b);
});
$('#setBody').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'resetBtn') {
        if (confirm('Opravdu smazat všechny mince, vylepšení a odemčené power-upy?')) {
            save = defaultSave(); persist(); renderSettings(); updateWallets(); toast('Postup smazán');
        }
        return;
    }
    if (b.dataset.set) {
        const it = SETTINGS_UI.find(x => x.key === b.dataset.set), v = it.opts[+b.dataset.idx][0];
        if (it.key === 'arena' && v === 'xl' && !save.unlocked.XL) {
            Sfx.bad(); toast('🔒 Kup „Trvalá Mega aréna“ v obchodě'); return;
        }
        S()[it.key] = v;
    } else if (b.dataset.pu) {
        const id = b.dataset.pu;
        if (!isUnlocked(id)) { Sfx.bad(); toast('🔒 Odemkni v obchodě (záložka Aréna)'); return; }
        save.disabled[id] = !save.disabled[id];
    }
    persist(); renderSettings(); updateWallets(); Sfx.click();
});

updateWallets();
startMatch(true);
requestAnimationFrame(frame);
</script>
