// ===================== geometry helpers =====================
const geoCache=new Map();
function roundedBoxGeo(w,h,d,r,seg=3){
 const key='rb'+[w,h,d,r,seg].map(v=>v.toFixed(4)).join(',');if(geoCache.has(key))return geoCache.get(key);
 r=Math.min(r,w/2,h/2,d/2)*0.999;const S=seg*2+1;
 const g=new THREE.BoxGeometry(w,h,d,S,S,S);const p=g.attributes.position,n=g.attributes.normal;
 const hw=w/2-r,hh=h/2-r,hd=d/2-r;
 const remap=(v,half,inner)=>{const i=Math.round((v+half)/(2*half)*S);return i<=seg?-half+(half-inner)*(i/seg):inner+(half-inner)*((i-seg-1)/seg);};
 for(let i=0;i<p.count;i++){
  let x=remap(p.getX(i),w/2,hw),y=remap(p.getY(i),h/2,hh),z=remap(p.getZ(i),d/2,hd);
  const ix=clamp(x,-hw,hw),iy=clamp(y,-hh,hh),iz=clamp(z,-hd,hd);let dx=x-ix,dy=y-iy,dz=z-iz;const l=Math.hypot(dx,dy,dz)||1;dx/=l;dy/=l;dz/=l;
  p.setXYZ(i,ix+dx*r,iy+dy*r,iz+dz*r);n.setXYZ(i,dx,dy,dz);
 }
 g.deleteAttribute('uv');geoCache.set(key,g);return g;
}
function cylGeo(r1,r2,h,seg=14){const k=`cy${r1},${r2},${h},${seg}`;if(!geoCache.has(k))geoCache.set(k,new THREE.CylinderGeometry(r1,r2,h,seg,1));return geoCache.get(k);}

function mergeGeos(list){
 let nv=0,ni=0;for(const g of list){nv+=g.attributes.position.count;ni+=g.index?g.index.count:g.attributes.position.count;}
 const P=new Float32Array(nv*3),N=new Float32Array(nv*3),I=new Uint32Array(ni);let vo=0,io=0;
 for(const g of list){const pa=g.attributes.position,na=g.attributes.normal;P.set(pa.array,vo*3);N.set(na.array,vo*3);

}

function gridTex(){

 g.fillStyle='#161c27';g.fillRect(0,0,256,256);
 for(let i=0;i<60;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*0.025})`;g.fillRect(Math.random()*256,Math.random()*256,Math.random()*70,Math.random()*70);}

[[-8,-8,2,2,4.5],[8,-8,2,2,4.5],[-8,4,2,2,4.5],[8,4,2,2,4.5],[0,-3,6,0.6,1.2],[-14,-2,0.6,6,1.2],[14,-6,0.6,6,1.2],[-5,-14,5,0.6,1.2],[6,-15,5,0.6,1.2],[-13,10,4,0.6,1.2],[13,9,4,0.6,1.2],[-15,-15,2.5,2.5,2.2],[15,-15,2.5,2.5,2.2],[0,-11,3,3,2.8]].forEach(b=>addBlock(...b));
function pushOutBoxes(p,r,top=0){
 let hit=false;
 for(const b of BOXES){

function meleeHits(h,dt){

  const pt=D.pts[k],wp=o.obj.localToWorld(new V3(pt.x,pt.y,pt.z)),loc=frame.worldToLocal(wp.clone());

 if(inVR){let h=hands[UI.ptr];if(!h.ctl)h=hands[1-UI.ptr];if(!h.ctl)return;const ray=h.ctl.ray;_m.identity().extractRotation(ray.matrixWorld);raycaster.ray.origin.setFromMatrixPosition(ray.matrixWorld);raycaster.ray.direction.set(0,0,-1).applyMatrix4(_m);
  hit=raycaster.intersectObject(panel,false)[0]||null;h.ctl.laser.visible=true;h.ctl.laser.scale.set(1,1,hit?hit.distance:2);if(hit){h.ctl.dot.visible=true;h.ctl.dot.position.copy(hit.point);}}
 else{raycaster.setFromCamera(UI.mouse,camera);hit=raycaster.intersectObject(panel,false)[0]||null;}
 let idx=-1;if(hit&&hit.uv){const x=hit.uv.x*UW,y=(1-hit.uv.y)*UH;idx=UI.buttons.findIndex(b=>b.act&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);}
 if(idx!==UI.hover){UI.hover=idx;drawUI();if(idx>=0){sfx('hover');if(inVR)haptic(hands[UI.ptr],0.15,15);}}
 renderer.domElement.style.cursor=idx>=0&&!inVR?'pointer':'default';
}
function menuClick(){const b=UI.buttons[UI.hover];if(!b||!b.act)return;if(b.disabled){sfx('deny');return;}sfx('click');UI.msg='';b.act();if(UI.open)drawUI();}
function buyWeapon(id){const D=W[id];if(save.owned[id])return;if(save.scrap<D.price){uiMsg('Not enough scrap — you need '+(D.price-save.scrap)+' more ⚙');sfx('deny');return;}save.scrap-=D.price;save.owned[id]=true;ensureWeapons();if(SLOTS.some(s=>!s.item))equipWeapon(id,true);else uiMsg(D.name+' bought! It is on the ARMORY rack behind spawn (all slots full).','#7dff9a');sfx('buy');persist();}
function equipWeapon(id,bought){const o=weapons[id];if(!o)return;if(o.heldBy){uiMsg(W[id].name+' is already in your hand.','#7dff9a');return;}const s=o.inSlot||preferredSlot(o);holster(o,s);uiMsg((bought?W[id].name+' bought and ':W[id].name+' ')+'equipped on '+s.name+(inVR?' — reach there to draw it':' — press '+(s.i+1)+' to draw it'),'#7dff9a');}
function buyUp(u){const lv=save.up[u.id]||0;if(lv>=5)return;const c=u.cost[lv];if(save.scrap<c){uiMsg('Not enough scrap — you need '+(c-save.scrap)+' more ⚙');sfx('deny');return;}save.scrap-=c;save.up[u.id]++;if(u.id==='hp')game.hp+=25;persist();updateFistLook();sfx('buy');}
function resetProgress(){
 const st=save.settings;save=defSave();save.settings=st;
 for(const id in weapons){const o=weapons[id];freeObj(o);if(o.inSlot)o.inSlot.item=null;scene.remove(o.obj);disposeTree(o.obj);phys.splice(phys.indexOf(o),1);delete weapons[id];}
 persist();ensureWeapons();updateFistLook();clearRobots();game.state='title';game.dummyT=0;game.hp=maxHp();UI.confirmReset=false;updateSlotHUD();uiMsg('Progress reset.');
}

// ===================== HUD =====================
const $=id=>document.getElementById(id);
const hudFill=$('hpfill'),hpNum=$('hpnum'),scrapEl=$('scrap'),waveEl=$('wave'),msgEl=$('msg'),hint=$('hint'),cross=$('cross'),hitm=$('hitm'),slotsEl=$('slots');
let hudMsgText='',hudMsgT=0,hitT=0;
function hudMsg(t,d){hudMsgText=t;hudMsgT=d;}
function hitMarker(){hitT=0.15;}
function updateSlotHUD(){slotsEl.innerHTML=SLOTS.map((s,i)=>`<div class="slot pn${s.item&&s.item.heldBy?' on':''}"><i>${i+1} · ${s.name}</i>${s.item?W[s.item.id].name:'—'}</div>`).join('')+((h=>h?`<div class="slot pn on"><i>IN HAND</i>${W[h.id].name}</div>`:'')(heldWeapon(hands[1])));}
let lastHudKey='';
function updateHUD(dt){
 if(!inVR){
  hudFill.style.width=(clamp(game.hp/maxHp(),0,1)*100)+'%';hpNum.textContent=Math.ceil(Math.max(0,game.hp))+' / '+maxHp();scrapEl.textContent='⚙ '+save.scrap;
  const wv=game.state==='title'?'TRAINING  ·  <b>TAB</b> FOR MENU':game.state==='intermission'?'WAVE '+game.wave+' CLEARED  ·  NEXT IN <b>'+Math.ceil(game.interT)+'s</b>':game.state==='dead'?'SCRAPPED':'WAVE <b>'+game.wave+'</b>  ·  ROBOTS LEFT <b>'+(game.toSpawn+aliveEnemies())+'</b>';
  if(waveEl.innerHTML!==wv)waveEl.innerHTML=wv;
  msgEl.textContent=hudMsgText;msgEl.style.opacity=hudMsgT>0?1:0;
  const vis=!UI.open;cross.style.display=vis?'block':'none';slotsEl.style.display=vis?'flex':'none';
  const ht=UI.open?'':hands[1].tk?'Hold LEFT CLICK to pull it in · release F to throw':'WASD move · Space jump · L/R click punch/swing/fire · E/Q grab & throw · F levitate · R reload · 1-4 slots · H holster · Tab menu';if(hint.textContent!==ht)hint.textContent=ht;
  const k=SLOTS.map(s=>s.item?s.item.id+(s.item.heldBy?1:0):'-').join()+(heldWeapon(hands[1])||{}).id;if(k!==lastHudKey){lastHudKey=k;updateSlotHUD();}
  hitT-=dt;hitm.style.opacity=hitT>0?1:0;
  const gw=heldWeapon(hands[1]),ae=$('ammo');
  if(gw&&gw.def.type==='gun'&&!UI.open){ae.style.display='block';const t=gw.reloadT>0?'<small>'+W[gw.id].name.toUpperCase()+'</small>RELOADING':'<small>'+W[gw.id].name.toUpperCase()+' · R RELOAD</small>'+(gw.magIn?gw.ammo:0)+' / '+gw.def.cap;if(ae.innerHTML!==t)ae.innerHTML=t;ae.style.color=gw.magIn&&gw.ammo>gw.def.cap*0.25?'#7dff9a':gw.magIn&&gw.ammo>0?'#ffb347':'#ff4d3a';}else ae.style.display='none';
 }
 hudMsgT-=dt;
 if(inVR){wristT-=dt;if(wristT<=0){wristT=0.25;drawWrist();}}
 hurtFlash=Math.max(0,hurtFlash-dt*1.8);hurtSphere.material.opacity=hurtFlash*0.45;hurtSphere.visible=hurtFlash>0.01;
 flashLight.intensity*=Math.exp(-dt*14);
 if(annT>0){annT-=dt;ann.material.opacity=Math.min(1,annT*2);if(annT<=0)ann.visible=false;}
}

// ===================== start =====================
ensureWeapons();
save.slots.forEach((id,i)=>{if(id&&weapons[id]&&!weapons[id].inSlot){const o=weapons[id];o.onRack=false;o.inSlot=SLOTS[i];SLOTS[i].item=o;drawRackLabel(id);}});
spawnDummy();updateSlotHUD();
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load(`900 40px Orbitron`),document.fonts.load(`700 40px Rajdhani`)]).then(()=>{if(UI.open)drawUI();for(const id of ALL_W)drawRackLabel(id);}).catch(()=>{});}
const clock=new THREE.Clock();let started=false;
renderer.setAnimationLoop(()=>{
 const rdt=Math.min(clock.getDelta(),0.05);now+=rdt;const gdt=hitStop>0?rdt*0.12:rdt;hitStop-=rdt;
 camera.getWorldPosition(playerHead);
 if(inVR){for(const h of hands)if(h.tracked&&h.ctl)updateTracked(h);readVR();}
 if(UI.needsPlace>0){UI.needsPlace--;if(UI.needsPlace===0&&UI.open)placePanel();}
 const paused=UI.open;
 if(!paused){updatePlayer(rdt);updateGame(gdt);for(const r of robots)r.update(gdt);}
 scene.updateMatrixWorld();
 updateHands(rdt);updateBody(rdt);updateTK(rdt,paused);
 if(!paused){handInteractions(rdt);updatePhys(gdt);updateBolts(gdt);updateDebris(gdt);updatePopups(rdt);}
 updateTracers(rdt);
 if(UI.open&&inVR)updateMenuPointer();
 updateHUD(rdt);
 renderer.render(scene,camera);
 if(!started){started=true;$('boot').style.display='none';openMenu('play');}
});
window.__game={updateTracked,handCtl,doJump,THREE,scene,setCurl,findTK,startTK,endTK,ejectMag,game,robots,hands,phys,save,UI,menuClick,startRun,openMenu,closeMenu,goPage,drawUI,buyWeapon,equipWeapon,desktopAction,tryGrab,release,rig,camera,weapons,fire,SLOTS,drawSlot,V3,hurtPlayer};
</script>
